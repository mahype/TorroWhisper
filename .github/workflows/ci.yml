name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-swift:
    name: Rust + Swift build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Opt whisper.cpp's CMake out of -mcpu=native, which newer Apple clang
      # on the macos-15 runner rejects. The flag is only used for native-CPU
      # optimizations we don't need in CI — the release workflow (macos-14)
      # keeps them enabled for the shipped binary.
      SOURCE_DATE_EPOCH: '1'
    steps:
      - uses: actions/checkout@v7

      # FoundationModels is weak-linked so the app still runs on macOS 14,
      # but compiling the real Apple post-processing backend requires the
      # macOS 26 SDK. Older SDKs intentionally build the Rust crate as stubs.
      - name: Select Xcode 26 (FoundationModels SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      # Rust test binaries link the Swift bridge dynamically. Keep the selected
      # toolchain's runtime path available for embedding in those binaries.
      - name: Configure Swift runtime path
        run: |
          swift_usr_dir="$(dirname "$(dirname "$(xcrun --find swiftc)")")"
          swift_runtime_dir="$swift_usr_dir/lib/swift-5.5/macosx"
          test -f "$swift_runtime_dir/libswift_Concurrency.dylib"
          echo "SWIFT_RUNTIME_DIR=$swift_runtime_dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ env.SWIFT_RUNTIME_DIR }}

      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # quick-xml is locked to ^0.39 by wayland-scanner through enigo's
          # Linux-only backend. It is present in Cargo.lock but is not compiled
          # or reachable in this macOS application.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny check bans licenses sources

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging apps/torrowhisper-macos/Sources

      - name: swift-format lint
        run: swift format lint --recursive apps/torrowhisper-macos/Sources

      - name: Build Rust bridge (debug)
        run: cargo build -p torrowhisper-bridge

      - name: Locate FluidAudio bridge
        run: |
          fluidaudio_bridge="$(find target/debug/build -path '*/fluidaudio-rs-*/out/swift-build/release/libFluidAudioBridge.a' -print -quit)"
          test -f "$fluidaudio_bridge"
          echo "FLUIDAUDIO_BRIDGE=$fluidaudio_bridge" >> "$GITHUB_ENV"

      - name: Build Swift app (debug)
        run: swift build --package-path apps/torrowhisper-macos -Xlinker "$FLUIDAUDIO_BRIDGE"

      - name: Swift tests
        run: swift test --package-path apps/torrowhisper-macos -Xlinker "$FLUIDAUDIO_BRIDGE"
