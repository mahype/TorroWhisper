name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # See ci.yml for rationale — disables whisper.cpp's -mcpu=native.
      SOURCE_DATE_EPOCH: '1'
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - uses: actions/checkout@v7

      # Xcode must be selected BEFORE codeql init so the tracer wraps the
      # right Swift toolchain.
      - name: Select Xcode 26 (FoundationModels SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # CodeQL analyzes first-party Swift sources only. The regular CI job
      # separately builds and tests the real Rust and FluidAudio bridge. Keep
      # native symbols unresolved here so CodeQL's Swift tracer can select its
      # preferred architecture independently of the hosted runner.
      - name: Build Swift app for analysis
        run: swift build --package-path apps/torrowhisper-macos --scratch-path "$RUNNER_TEMP/torrowhisper-codeql" -Xlinker -undefined -Xlinker dynamic_lookup
        env:
          TORROWHISPER_SKIP_NATIVE_BRIDGE: '1'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
