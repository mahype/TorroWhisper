name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # See ci.yml for rationale — disables whisper.cpp's -mcpu=native.
      SOURCE_DATE_EPOCH: '1'
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - uses: actions/checkout@v7

      # Xcode must be selected BEFORE codeql init so the tracer wraps the
      # right Swift toolchain.
      - name: Select Xcode 26 (FoundationModels SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Discard artifacts built while CodeQL traced FluidAudio's nested
          # Swift build: those can contain x86_64 objects in the arm64 bridge.
          prefix-key: v1-codeql-untraced-bridge

      # FluidAudio's build.rs invokes Swift without an explicit architecture.
      # Build dependencies before enabling the CodeQL tracer so they use the
      # runner's native arm64 target. The app itself is traced below.
      - name: Build Rust bridge (required for Swift linker)
        run: cargo build -p torrowhisper-bridge

      - name: Verify FluidAudio architecture
        run: |
          for library in target/debug/build/fluidaudio-rs-*/out/swift-build/release/libFluidAudioBridge.a; do
            test -f "$library"
            lipo -info "$library"
            lipo "$library" -verify_arch arm64
          done

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # Explicit --arch arm64: macos-15 is Apple Silicon and the Rust
      # bridge is built for arm64 only. Without this, CodeQL's Swift
      # tracer has been observed to default to x86_64 on hosted runners,
      # which then fails to link against the arm64 static lib.
      - name: Build Swift app for analysis
        run: swift build --package-path apps/torrowhisper-macos --arch arm64

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
