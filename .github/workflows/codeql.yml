name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # See ci.yml for rationale — disables whisper.cpp's -mcpu=native.
      SOURCE_DATE_EPOCH: '1'
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - uses: actions/checkout@v7

      # Xcode must be selected BEFORE codeql init so the tracer wraps the
      # right Swift toolchain.
      - name: Select Xcode 26 (FoundationModels SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Rust bridge (required for Swift linker)
        run: cargo build -p torrowhisper-bridge

      - name: Locate FluidAudio bridge
        run: |
          runner_arch="$(uname -m)"
          while IFS= read -r candidate; do
            if lipo -archs "$candidate" | grep -qw "$runner_arch"; then
              fluidaudio_bridge="$candidate"
              break
            fi
          done < <(find target/debug/build -path '*/fluidaudio-rs-*/*' -name 'libFluidAudioBridge.a' -print)
          test -f "$fluidaudio_bridge"
          echo "FLUIDAUDIO_BRIDGE=$GITHUB_WORKSPACE/$fluidaudio_bridge" >> "$GITHUB_ENV"

      # Initialize immediately before the first-party Swift build. The Rust
      # bridge invokes Swift while compiling a third-party dependency, but it
      # is not part of this Swift-only CodeQL database and is intentionally
      # kept outside the tracer to preserve the job's time budget.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # Build for the runner's native architecture, matching the Rust and
      # FluidAudio archives selected above. CodeQL's macos-15 runners can be
      # Intel or Apple Silicon depending on the available runner image.
      - name: Build Swift app for analysis
        run: swift build --package-path apps/torrowhisper-macos -Xlinker "$FLUIDAUDIO_BRIDGE"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
